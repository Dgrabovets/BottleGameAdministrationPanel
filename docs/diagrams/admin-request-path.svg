<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Admin request path: browser, cookie, Next.js server, Bottle Game API, PostgreSQL">
  <!-- Aeternus silver dark theme. Fonts: JetBrains Mono (titles), IBM Plex Sans (body). The PNG is this file at 2x -->
  <style>
    text { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 15px; fill: #d1d7e0; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .name { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .zone { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; font-size: 14px; letter-spacing: 3px; fill: #ffffff; }
    .node { fill: #1b1e24; stroke: #646d7c; stroke-width: 1.5; }
    .external { fill: #1b1e24; stroke: #8b949e; stroke-width: 1.5; }
    .data { fill: none; stroke: #e8ecf2; stroke-width: 2.8; marker-end: url(#green); }
    .login { fill: none; stroke: #aab3c0; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#teal); }
    .label { font-size: 14px; fill: #ffffff; text-anchor: middle; }
    .external { fill: #000000; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8ecf2"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aab3c0"/></marker>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f38" stop-opacity="0"/><stop offset=".75" stop-color="#2a2f38"/><stop offset="1" stop-color="#2a2f38" stop-opacity="0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b8494" stop-opacity="0"/><stop offset=".75" stop-color="#7b8494"/><stop offset="1" stop-color="#7b8494" stop-opacity="0"/></linearGradient>
    <linearGradient id="second" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5260" stop-opacity="0"/><stop offset=".75" stop-color="#4a5260"/><stop offset="1" stop-color="#4a5260" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#000000"/>

  <!-- light columns, denser and brighter to the right, never under text -->
  <g>
    <rect x="720" y="-10" width="2" height="76" fill="url(#deep)" opacity=".5"/>
    <rect x="726" y="-4" width="2" height="62" fill="url(#deep)" opacity=".4"/>
    <rect x="760" y="30" width="2" height="84" fill="url(#accent)" opacity=".35"/>
    <rect x="766" y="36" width="4" height="70" fill="url(#accent)" opacity=".45"/>
    <rect x="772" y="28" width="2" height="66" fill="url(#accent)" opacity=".3"/>
    <rect x="822" y="0" width="2" height="90" fill="url(#second)" opacity=".5"/>
    <rect x="828" y="6" width="2" height="72" fill="url(#second)" opacity=".4"/>
    <rect x="868" y="42" width="2" height="82" fill="url(#deep)" opacity=".75"/>
    <rect x="874" y="36" width="4" height="76" fill="url(#deep)" opacity=".7"/>
    <rect x="880" y="46" width="2" height="68" fill="url(#deep)" opacity=".6"/>
    <rect x="918" y="-8" width="2" height="94" fill="url(#accent)" opacity=".55"/>
    <rect x="924" y="0" width="2" height="78" fill="url(#accent)" opacity=".65"/>
    <rect x="962" y="26" width="4" height="90" fill="url(#accent)" opacity=".6"/>
    <rect x="968" y="34" width="2" height="72" fill="url(#accent)" opacity=".75"/>
    <rect x="974" y="24" width="2" height="80" fill="url(#accent)" opacity=".5"/>
    <rect x="1012" y="4" width="2" height="102" fill="url(#second)" opacity=".7"/>
    <rect x="1018" y="12" width="2" height="82" fill="url(#second)" opacity=".6"/>
    <rect x="1050" y="38" width="2" height="86" fill="url(#accent)" opacity=".8"/>
    <rect x="1056" y="30" width="4" height="92" fill="url(#accent)" opacity=".9"/>
    <rect x="1062" y="44" width="2" height="70" fill="url(#accent)" opacity=".65"/>
    <rect x="1096" y="-6" width="2" height="106" fill="url(#second)" opacity=".85"/>
    <rect x="1102" y="2" width="4" height="90" fill="url(#second)" opacity=".75"/>
    <rect x="1130" y="22" width="2" height="98" fill="url(#accent)" opacity="1"/>
    <rect x="1136" y="14" width="4" height="102" fill="url(#accent)" opacity=".85"/>
    <rect x="1142" y="28" width="2" height="84" fill="url(#deep)" opacity=".9"/>
    <rect x="1148" y="20" width="2" height="90" fill="url(#accent)" opacity=".9"/>
  </g>

  <rect x="40" y="30" width="28" height="4" rx="2" fill="#e8ecf2"/>
  <text x="80" y="37" class="mono" style="font-size:15px;font-weight:500;letter-spacing:6px;fill:#e8ecf2">DGRABOVETS</text>
  <text x="38" y="80" class="name" style="font-size:32px">Bottle Game Admin Panel</text>
  <text x="40" y="112" class="mono" style="font-size:17px;font-weight:500;fill:#e8ecf2">Admin request path</text>

  <text x="40" y="162" class="zone">BROWSER</text>
  <text x="440" y="162" class="zone">NEXT.JS SERVER</text>
  <text x="946" y="162" class="zone">BOTTLE GAME API</text>

  <!-- sign in -->
  <rect x="40" y="180" width="240" height="120" rx="14" class="node"/>
  <text x="58" y="212" class="name">Login page</text>
  <text x="58" y="240">Posts the login and</text>
  <text x="58" y="262">the password</text>

  <rect x="440" y="180" width="340" height="120" rx="14" class="node"/>
  <text x="458" y="212" class="name">/api/auth/login</text>
  <text x="458" y="240">Same-origin check</text>
  <text x="458" y="262">25 attempts a minute per client</text>
  <text x="458" y="284">Stores the JWT in the cookie</text>

  <rect x="946" y="180" width="214" height="120" rx="14" class="external"/>
  <text x="962" y="212" class="name">admin-login</text>
  <text x="962" y="240">Checks the password</text>
  <text x="962" y="262">Issues the JWT</text>

  <path d="M282 214H436" class="login"/>
  <text x="359" y="204" class="label">login, password</text>
  <path d="M438 270H284" class="login"/>
  <text x="359" y="260" class="label">Set-Cookie</text>
  <path d="M782 214H942" class="login"/>
  <text x="862" y="204" class="label">credentials</text>
  <path d="M944 270H784" class="login"/>
  <text x="862" y="260" class="label">JWT</text>

  <!-- the cookie -->
  <rect x="40" y="316" width="240" height="94" rx="14" fill="#1b1e24" stroke="#aab3c0" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="58" y="343" class="mono" style="font-size:14px;font-weight:700;fill:#aab3c0">bottle_admin_token</text>
  <text x="58" y="369" style="font-size:14px">httpOnly, sameSite=lax</text>
  <text x="58" y="392" style="font-size:14px">Ends with the JWT (6 hours)</text>

  <!-- data requests -->
  <rect x="40" y="424" width="240" height="224" rx="14" class="node"/>
  <text x="58" y="456" class="name">React 19 UI</text>
  <text x="58" y="486">axios, base URL</text>
  <text x="58" y="508" class="mono" style="font-size:14px">/api/backend</text>
  <text x="58" y="544">Scripts cannot read</text>
  <text x="58" y="566">the token</text>
  <text x="58" y="602">On 401: logs out and</text>
  <text x="58" y="624">opens /login</text>

  <rect x="440" y="424" width="340" height="94" rx="14" class="node"/>
  <text x="458" y="453" class="name">middleware.ts</text>
  <text x="458" y="479">No valid session: /login, or 401 for data</text>
  <text x="458" y="501">Moderator on an admin page: redirect</text>

  <rect x="440" y="546" width="340" height="146" rx="14" class="node"/>
  <text x="458" y="575" class="name">/api/backend/[...path]</text>
  <text x="458" y="603">Origin check on writes</text>
  <text x="458" y="625">Allow-list of API paths</text>
  <text x="458" y="647">Adds Authorization from the cookie</text>
  <text x="458" y="669">No redirects, 15 s timeout</text>

  <rect x="946" y="494" width="214" height="120" rx="14" class="external"/>
  <text x="962" y="526" class="name">Controllers</text>
  <text x="962" y="554">Check the token</text>
  <text x="962" y="576">signature and the</text>
  <text x="962" y="598">role</text>

  <rect x="946" y="646" width="214" height="64" rx="14" class="external"/>
  <text x="962" y="685" class="name">PostgreSQL</text>

  <path d="M282 460H436" class="data"/>
  <text x="359" y="450" class="label">request + cookie</text>
  <path d="M610 520V542" class="data"/>
  <path d="M782 580H942" class="data"/>
  <text x="862" y="570" class="label">Bearer JWT</text>
  <path d="M1053 616V642" class="data"/>
  <path d="M438 624H284" class="data"/>
  <text x="359" y="614" class="label">status, JSON,</text>
  <text x="359" y="646" class="label">X-Total-Count</text>

  <!-- legend -->
  <path d="M40 732H86" class="login"/>
  <text x="98" y="737">Sign in</text>
  <path d="M200 732H246" class="data"/>
  <text x="258" y="737">Data request</text>
  <rect x="390" y="722" width="30" height="20" rx="5" class="external"/>
  <text x="432" y="737">Outside the panel</text>
</svg>
